<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion paws of love</title>
    <!--CSS de Bootrstrap 5. 3. 3 desde url predeterminada-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--libreria iconos de bootstrap-->
     <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet"><!--llama los estilos personalizados-->
</head>
<body class="login-fondo">

    <main class="login-card"><!--contenido principal de la pagina-->
        <header class="login-encabezado"><!--encabezado del login-->
            <!--icono de la tienda-->
           <span class="display-4">🐾</span>
            <h1 class="h3 fw-bold">Hola, bienvenido</h1>
            <p class="text-secondary mb-0">Crea tu cuenta paws of love para iniciar procesos de adopcion</p>

        </header>

        <!--form permite crear el contenido de un formulario cuando se envia nos lleva a la ruta dashboard el method nos envia la informacion con get-->
        <form action="dashboard.html" method="get">
             <div class="form-floating mb-3"><!--agrupar un contenido en un contenedor-->

            <input type="email" class="form-control" id="correo" placeholder="breiner@correo.com" required><!--type obliga que tenga el @, placeholder el texto de ejemplo-->
            <label for="correo"><i class="bi bi-envelope me-1"></i>correo electronico</label><!--es una etiqueta de texto que con el for conecta con el input-->

         </div>

         <div class="form-floating mb-3">
            <input type="password" class="form-control" id="clave" placeholder="minimo 6 caracteres" minlength="6" required><!--type=password oculta lo que escribes, minlength=6 almenos 6 caracteres-->
            <label for="clave"><i class="bi bi-lock me-1"></i>contraseña</label>
            
         </div>

         <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
            <input class="form-check-input" type="checkbox" id="recordar"><!--type checkbox es casilla de verificacion-->
            <label class="form-check-label" for="recordar">recordarme</label>
         </div>
         <a href="#" class="small text-decoration-none">¿olvido su contraseña?</a>
    </div>

         <button type="submit" class="btn btn-sena w-100 py-2 fw-semibold">
            <i class="bi bi-box-arrow-in-right me-1"></i>ingresar
        </button><!--envia el formulario antes revisa los campos required email y minlength-->
    </form><!--cierra el formulario-->
        
         <p class="login-pie">¿no tienes cuenta?<a href="registro.html" class="text-decoration-none">registrate</a> </p>
         <footer class="login-pie">2026 PAWS OF LOVE</footer><!--pie de pagina-->
    </main>
    
</body>
</html>
