<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | PAWS OF LOVE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="login-fondo">
    <main class="login-card ancha">
        <header class="login-encabezado">
        <i class="bi bi-person-plus display-5 text-sena"></i>
        <h1 class="h3 fw-bold">Crea tu cuenta PAWS OF LOVE</h1>
        <p class="text-secondary mb-0">Completa tus datos para registrarte en Paws of love</p>
        </header>

        <form action="index.html" method="get" class="row g-3">
            <div class="col-md-6">
                <label for="regNombres" class="form-label">Nombres</label>
                <input type="text" class="form-control" id="regNombres" required>
            </div>
            <div class="col-md-6">
                <label for="regApellidos" class="form-label">Apellidos</label>
                <input type="text" class="form-control" id="regApellidos" required>
            </div>
            
            <div class="cold-md-4">
                <label for="regTipoDoc" class="form-label">Tipo de documento</label>
                <select class="form-select" id="regTipoDoc">
                    <option value="CC">cedula ciudadania</option>
                    <option value="TI">Tarjeta de identidad</option>
                    <option value="CE">Cedula extranjera</option>
                </select>
            </div>
            <div class="cold-md-8">
                <label for="regDocumento" class="form-label">Numero de documento</label>
                <input type="text" class="form-control" id="regDocumento" inputmode="numeric" required>
            </div>
            <div class="col-12">
                <label for="regCorreo" class="form-label">Correo electronico</label>
                <input type="email" class="form-control" id="regCorreo" placeholder="ej:nombre@correo.com" required>
            </div>
            <div class="col-12">
                <label for="regCelular" class="form-label">Numero de celular</label>
                <input type="text" class="form-control" id="regCelular" inputmode="numeric" placeholder="ej: 3114073317" required=>
            </div>
            <div class="col-md-6">
                <label for="regClave" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="regClave" minlength="6" required>
            </div>
            <div class="col-md-6">
                <label for="regConfirmar" class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" id="regConfirmar" minlength="6" required>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rgTerminos" required>
                    <label class="form-check-label" for="rgTerminos">Acepto el tratamiento de mis datos personales</label>
                </div>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-sena w-100 py-2 fw semibold">
                    <i class="bi bi-check2-circle me-1"></i>Crear cuenta
                </button>
            </div>
        </form>

        <p class="login-pie">¿Ya tienes una cuenta?<a href="index.html" class="text-decoration-none"> Inicia sesion</a></p>

    </main>
</body>
</html>
